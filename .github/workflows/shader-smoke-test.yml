name: Shader smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  glsl-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools

      - name: Validate terrain vertex shader
        run: glslangValidator -S vert shaders/gbuffers_terrain.vsh

      - name: Validate terrain fragment shader
        run: glslangValidator -S frag shaders/gbuffers_terrain.fsh

      - name: Validate shadow vertex shader
        run: glslangValidator -S vert shaders/shadow.vsh

      - name: Validate shadow fragment shader
        run: glslangValidator -S frag shaders/shadow.fsh

      - name: Validate final vertex shader
        run: glslangValidator -S vert shaders/final.vsh

      - name: Validate final fragment shader
        run: glslangValidator -S frag shaders/final.fsh

      - name: Verify required project files
        run: |
          test -f README.md
          test -f shaders/shaders.properties
          test -f shaders/gbuffers_terrain.vsh
          test -f shaders/gbuffers_terrain.fsh
          test -f shaders/shadow.vsh
          test -f shaders/shadow.fsh
          test -f shaders/final.vsh
          test -f shaders/final.fsh
          test -f signature.ws
